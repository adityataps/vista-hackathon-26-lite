name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  APP_NAME: payinvestigator
  ECR_BACKEND_REPO: payinvestigator-backend
  ECR_INGEST_REPO: payinvestigator-ingest
  LAMBDA_BACKEND_NAME: payinvestigator-backend
  LAMBDA_INGEST_NAME: payinvestigator-payment-xml-ingest

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ingest: ${{ steps.flags.outputs.ingest }}
      backend: ${{ steps.flags.outputs.backend }}
      frontend: ${{ steps.flags.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            ingest:
              - 'jobs/payment-ingest/**'
            backend:
              - 'backend/**'
              - 'jobs/pacs008-generator/**'
              - 'infra/assets/**'
            frontend:
              - 'frontend/**'

      - name: Resolve changed components
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_INGEST: ${{ steps.filter.outputs.ingest }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ingest=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "ingest=${FILTER_INGEST}" >> "$GITHUB_OUTPUT"
            echo "backend=${FILTER_BACKEND}" >> "$GITHUB_OUTPUT"
            echo "frontend=${FILTER_FRONTEND}" >> "$GITHUB_OUTPUT"
          fi

  test-backend:
    needs: changes
    if: |
      needs.changes.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

  deploy-ingest:
    needs: changes
    if: |
      needs.changes.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.ingest == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-ingest-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/payinvestigator-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ingest Lambda image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_INGEST_REPO:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_INGEST_REPO:latest \
                       jobs/payment-ingest
          docker push $ECR_REGISTRY/$ECR_INGEST_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_INGEST_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_INGEST_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy ingest Lambda
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_INGEST_NAME \
            --image-uri ${{ steps.build.outputs.image }} \
            --region $AWS_REGION

  deploy-backend:
    needs: [changes, test-backend]
    if: |
      needs.changes.result == 'success' &&
      needs.test-backend.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/payinvestigator-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile \
                       -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest \
                       .
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy backend Lambda
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_BACKEND_NAME \
            --image-uri ${{ steps.build.outputs.image }} \
            --region $AWS_REGION

  deploy-frontend:
    needs: changes
    if: |
      needs.changes.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/payinvestigator-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve backend URL and frontend bucket
        id: runtime
        run: |
          echo "api_base_url=$(aws lambda get-function-url-config --function-name $LAMBDA_BACKEND_NAME --query FunctionUrl --output text --region $AWS_REGION)" >> $GITHUB_OUTPUT
          echo "bucket=$APP_NAME-frontend-${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_OUTPUT

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.runtime.outputs.api_base_url }}
        run: npm run build

      - name: Sync frontend to S3 website bucket
        run: |
          aws s3 sync frontend/dist s3://${{ steps.runtime.outputs.bucket }} --delete --region $AWS_REGION
